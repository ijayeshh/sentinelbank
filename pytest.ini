[pytest]
# Registers the custom marker so `pytest -m "not llm"` works and pytest stops warning
# about an unknown mark.
#
# The `llm` tests are the only ones that need Ollama running. Everything else — the rails,
# the SQL pipeline, the audit chain, the middleware ordering — runs against the seeded
# database and a scripted stub model, so a reviewer without a GPU can still run:
#
#     pytest -m "not llm"
#
# and exercise the whole guardrail suite.
markers =
    llm: requires a running Ollama server (see README "Running")
