# NeMo Guardrails comparison stack (PROJECT_PLAN.md §4.4) — a SEPARATE profile.
#
# MUST NOT run alongside the main stack (§1.1 rule 7). NeMo loads its own embedding model
# and builds a vector index over every canonical form in nemo/rails/topics.co — roughly
# 200 MB with the sentence-transformers runtime — which the 8 GB budget cannot absorb on
# top of Presidio + spaCy, Prompt-Guard-86M, the app's own MiniLM, and 2 GB of weights in
# VRAM. Docker itself is capped at 3 GB by %USERPROFILE%\.wslconfig, so the container
# competes with Postgres for that cap as well.
#
#     docker compose down                                   # stop the main stack first
#     docker compose -f docker-compose.nemo.yml up --build   # then this one
#     python nemo/compare.py                                 # run the comparison
#     docker compose -f docker-compose.nemo.yml down
#
# The `isolation-guard` service below refuses to start if the main stack is still up, so
# the rule is enforced rather than merely documented — a comparison run against a
# swapping machine produces latency numbers that measure the swap file.

services:
  # ----------------------------------------------------------------------------
  # The guard. Every other service depends on it completing successfully.
  # ----------------------------------------------------------------------------
  # Checks for the main stack's Postgres container and for anything listening on the
  # API port. Both are cheap, and between them they catch the two ways this rule gets
  # broken: leaving `docker compose up -d` running, and leaving uvicorn running.
  #
  # Mounting the Docker socket read-only is what lets a container see its siblings.
  isolation-guard:
    image: docker:27-cli
    container_name: sentinelbank-nemo-guard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      MAIN_CONTAINER: sentinelbank-postgres
      API_HOST: host.docker.internal
      API_PORT: "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        fail() {
          echo ""
          echo "=============================================================="
          echo " REFUSING TO START - the main stack is still running."
          echo "=============================================================="
          echo " $$1"
          echo ""
          echo " PROJECT_PLAN.md 1.1 rule 7: the NeMo comparison stack and the"
          echo " main stack must never run at the same time. NeMo loads its own"
          echo " embedding model and vector index on a machine whose binding"
          echo " constraint is RAM, and Docker is capped at 3 GB."
          echo ""
          echo " Stop the main stack first:"
          echo "     docker compose down"
          echo "     # and stop uvicorn / streamlit if they are running"
          echo "=============================================================="
          exit 1
        }
        if docker ps --format '{{.Names}}' | grep -qx "$$MAIN_CONTAINER"; then
          fail "Container '$$MAIN_CONTAINER' is up."
        fi
        if nc -z -w 2 "$$API_HOST" "$$API_PORT" 2>/dev/null; then
          fail "Something is listening on $$API_HOST:$$API_PORT (uvicorn?)."
        fi
        echo "isolation check passed - main stack is down, starting NeMo"

  # ----------------------------------------------------------------------------
  # NeMo Guardrails, serving nemo/config.yml over HTTP.
  # ----------------------------------------------------------------------------
  nemo:
    build:
      context: .
      dockerfile: nemo/Dockerfile
    container_name: sentinelbank-nemo
    depends_on:
      isolation-guard:
        condition: service_completed_successfully
    ports:
      - "${NEMO_PORT:-8010}:8000"
    volumes:
      # Mounted rather than baked in, so editing topics.co and restarting is a two-second
      # loop. The comparison is a thing you iterate on.
      - ./nemo:/config:ro
    extra_hosts:
      # Ollama runs natively on the Windows host (it needs the GPU), not in a container.
      - "host.docker.internal:host-gateway"
    environment:
      # Keep the container's own torch on CPU and off the 4 GB card (§1.1 rule 5) — the
      # GPU belongs to Ollama, and NeMo's embedder is small enough that CPU is fine.
      CUDA_VISIBLE_DEVICES: ""
      # §1.1 rule 6, same reasoning as app/embeddings.py: stop torch spawning a thread
      # per core and thrashing against everything else on a 2-processor WSL cap.
      OMP_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
    # Hard ceiling well inside the 3 GB WSL cap. If NeMo needs more than this, that is
    # itself a finding for the comparison write-up rather than something to raise.
    mem_limit: 1500m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/v1/rails/configs', timeout=5).status==200 else 1)\""]
      interval: 10s
      timeout: 10s
      # First boot downloads all-MiniLM-L6-v2 and indexes every canonical form.
      start_period: 180s
      retries: 12
